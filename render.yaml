# Render用のBlueprint設定（Webサービスのみ。DBは外部のSupabaseを使う）
services:
  - type: web
    name: pocket-sub
    runtime: go
    plan: free
    buildCommand: go build -o bin/pocket-sub ./cmd/pocket-sub
    startCommand: ./bin/pocket-sub
    envVars:
      # Supabaseの接続文字列は、Renderのダッシュボードで値を設定する
      - key: DATABASE_URL
        sync: false
      # AI提案機能を使う場合のみ、Renderのダッシュボードで値を設定する
      - key: ANTHROPIC_API_KEY
        sync: false
